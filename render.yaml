services:
  - type: web
    name: weather-aware-truck-routing
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci --include=dev && npm run build && cd ../backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: TOMTOM_API_KEY
        sync: false
      - key: OPEN_METEO_BASE_URL
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
